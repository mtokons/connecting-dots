services:
  # Full-stack web service (serves both API and static frontend)
  - type: web
    name: connecting-dots-bd-election
    runtime: node
    region: singapore  # Closest to Bangladesh
    plan: free
    rootDir: ./
    buildCommand: cd client && NODE_ENV=development npm ci && ./node_modules/.bin/vite build && cd ../server && npm ci
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SCRAPE_INTERVAL
        value: 10
    healthCheckPath: /api/dashboard
    autoDeploy: true
