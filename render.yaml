services:
  # Full-stack web service (serves both API and static frontend)
  - type: web
    name: connecting-dots-bd-election
    runtime: node
    region: singapore  # Closest to Bangladesh
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SCRAPE_INTERVAL
        value: 10
    healthCheckPath: /api/dashboard
    autoDeploy: true
